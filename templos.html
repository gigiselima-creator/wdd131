<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Álbum de fotos de templos da Igreja de Jesus Cristo dos Santos dos Últimos Dias.">
    <title>Álbum do Templo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Verifique se os nomes das pastas no GitHub estão exatamente em minúsculas -->
    <link rel="stylesheet" href="estilos/templos.css">
    <link rel="stylesheet" href="estilos/templos-grandes.css">

    <script src="scripts/templos.js" defer></script>
</head>
<body>
    <header>
        <h1>Álbum do Templo</h1>
        <!-- O botão precisa ter o id="menu" para o JS funcionar -->
        <button id="menu" aria-label="Abrir Menu"></button>
        <nav class="navigation">
            <a href="#">Página Inicial</a>
            <a href="#">Antigo</a>
            <a href="#">Novo</a>
            <a href="#">Grande</a>
            <a href="#">Pequeno</a>
        </nav>
    </header>
    <main>
        <h2>Galeria de Templos</h2>
        <div class="galeria">
            <figure>
                <img src="imagens/manti_temple_lds.jpeg"Templo de Manti Utah" loading="lazy" width="400" height="250">
                <figcaption>Templo de Manti Utah</figcaption>
            </figure>
            <figure>
                <img src="imagens/salt_lake_temple_renovation_rendering.jpeg" alt="Templo de Salt Lake" loading="lazy" width="400" height="250">
                <figcaption>Templo de Salt Lake</figcaption>
            </figure>
            <figure>
                <img src="imagens/nauvoo_temple_lds.jpeg" alt="Templo de Nauvoo Illinois" loading="lazy" width="400" height="250">
                <figcaption>Templo de Nauvoo Illinois</figcaption>
            </figure>
            <figure>
                <img src="imagens/sao_paulo_brazil_temple_lds.jpeg" alt="Templo de São Paulo Brasil" loading="lazy" width="400" height="250">
                <figcaption>Templo de São Paulo Brasil</figcaption>
            </figure>
            <figure>
                <img src="imagens/rome_italy_temple.jpeg"Templo de Roma Itália" loading="lazy" width="400" height="250">
                <figcaption>Templo de Roma Itália</figcaption>
            </figure>
            <figure>
                <img src="imagens/paris_france_temple_exterior.jpeg" alt="Templo de Paris França" loading="lazy" width="400" height="250">
                <figcaption>Templo de Paris França</figcaption>
            </figure>
            <figure>
                <img src="imagens/tokyo_japan_temple.jpeg" alt="Templo de Tóquio Japão" loading="lazy" width="400" height="250">
                <figcaption>Templo de Tóquio Japão</figcaption>
            </figure>
            <figure>
                <img src="imagens/campinas_brazil_temple_lds.jpeg" alt="Templo de Campinas Brasil" loading="lazy" width="400" height="250">
                <figcaption>Templo de Campinas Brasil</figcaption>
            </figure>
            <figure>
                <img src="imagens/curitiba_brazil_temple.jpeg" alt="Templo de Curitiba Brasil" loading="lazy" width="400" height="250">
                <figcaption>Templo de Curitiba Brasil</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Gisele Albuquerque | Brasil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
