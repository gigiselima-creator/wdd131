<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Avalie um produto informando sua classificação, data de instalação, recursos úteis e comentários sobre sua experiência."
    >
    <meta name="author" content="Gisele Albuquerque">

    <title>Avaliação de Produto</title>

    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
        <h2>Compartilhe sua experiência</h2>
        <p>Preencha o formulário abaixo para registrar sua avaliação.</p>

        <form method="get" action="avaliacao.html">
            <div class="campo">
                <label for="produto">Produto:</label>
                <select id="produto" name="produto" required>
                    <option value="" selected disabled>
                        Selecione um produto...
                    </option>
                </select>
            </div>

            <fieldset>
                <legend>Classificação do produto</legend>
                <p>Selecione uma nota de 1 a 5 estrelas.</p>

                <div class="rating">
                    <input
                        type="radio"
                        id="classificacao1"
                        name="classificacao"
                        value="1"
                        required
                    >
                    <label for="classificacao1">1 estrela</label>

                    <input
                        type="radio"
                        id="classificacao2"
                        name="classificacao"
                        value="2"
                    >
                    <label for="classificacao2">2 estrelas</label>

                    <input
                        type="radio"
                        id="classificacao3"
                        name="classificacao"
                        value="3"
                    >
                    <label for="classificacao3">3 estrelas</label>

                    <input
                        type="radio"
                        id="classificacao4"
                        name="classificacao"
                        value="4"
                    >
                    <label for="classificacao4">4 estrelas</label>

                    <input
                        type="radio"
                        id="classificacao5"
                        name="classificacao"
                        value="5"
                    >
                    <label for="classificacao5">5 estrelas</label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="data">Data de instalação:</label>
                <input
                    type="date"
                    id="data"
                    name="data"
                    required
                >
            </div>

            <fieldset>
                <legend>Quais recursos você considera úteis?</legend>

                <div class="recurso">
                    <input
                        type="checkbox"
                        id="recurso1"
                        name="recursos"
                        value="facilidade de uso"
                    >
                    <label for="recurso1">Facilidade de uso</label>
                </div>

                <div class="recurso">
                    <input
                        type="checkbox"
                        id="recurso2"
                        name="recursos"
                        value="durabilidade"
                    >
                    <label for="recurso2">Durabilidade</label>
                </div>

                <div class="recurso">
                    <input
                        type="checkbox"
                        id="recurso3"
                        name="recursos"
                        value="bom desempenho"
                    >
                    <label for="recurso3">Bom desempenho</label>
                </div>

                <div class="recurso">
                    <input
                        type="checkbox"
                        id="recurso4"
                        name="recursos"
                        value="custo-beneficio"
                    >
                    <label for="recurso4">Bom custo-benefício</label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="avaliacao">Comentários adicionais (opcional):</label>
                <textarea
                    id="avaliacao"
                    name="avaliacao"
                    rows="5"
                    placeholder="Conte um pouco sobre sua experiência..."
                ></textarea>
            </div>

            <div class="campo">
                <label for="usuario">Seu nome (opcional):</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    autocomplete="name"
                >
            </div>

            <!-- Identificador único para evitar contar o mesmo envio novamente -->
            <input
                type="hidden"
                id="submissionId"
                name="submissionId"
                value=""
            >

            <button type="submit">Enviar avaliação</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="ano"></span> Gisele Albuquerque | WDD131</p>
    </footer>

    <script>
        document.querySelector("#ano").textContent =
            new Date().getFullYear();
    </script>
</body>
</html>
