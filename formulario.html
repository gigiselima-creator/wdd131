<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de avaliação de produto">
    <meta name="author" content="Gisele Albuquerque">
    <title>Avaliação de Produto</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
        <form method="get" action="avaliacao.html">

            <fieldset>
                <legend>Informações do Produto</legend>

                <label for="produto">Nome do Produto</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>
                        Selecione um Produto...
                    </option>
                </select>

                <label>Classificação Geral</label>
                <div class="rating">
                    <label for="rating1">☆</label>
                    <input type="radio" id="rating1" name="classificacao" value="1" required>

                    <label for="rating2">☆</label>
                    <input type="radio" id="rating2" name="classificacao" value="2">

                    <label for="rating3">☆</label>
                    <input type="radio" id="rating3" name="classificacao" value="3">

                    <label for="rating4">☆</label>
                    <input type="radio" id="rating4" name="classificacao" value="4">

                    <label for="rating5">☆</label>
                    <input type="radio" id="rating5" name="classificacao" value="5">
                </div>

                <label for="data">Data de Instalação</label>
                <input type="date" id="data" name="data" required>
            </fieldset>

            <fieldset>
                <legend>Recursos Úteis</legend>

                <label>
                    <input type="checkbox" id="recurso1" name="recursos" value="facilidade">
                    Facilidade de instalação
                </label>

                <label>
                    <input type="checkbox" id="recurso2" name="recursos" value="desempenho">
                    Desempenho
                </label>

                <label>
                    <input type="checkbox" id="recurso3" name="recursos" value="durabilidade">
                    Durabilidade
                </label>

                <label>
                    <input type="checkbox" id="recurso4" name="recursos" value="qualidade">
                    Qualidade
                </label>
            </fieldset>

            <fieldset>
                <legend>Comentários</legend>

                <label for="avaliacao">Avaliação Escrita <span>(Opcional)</span></label>
                <textarea id="avaliacao" name="avaliacao"></textarea>

                <label for="usuario">Nome de Usuário <span>(Opcional)</span></label>
                <input type="text" id="usuario" name="usuario">
            </fieldset>

            <input type="submit" value="Enviar Avaliação">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Gisele Albuquerque | Brasil</p>
        <p>Última atualização: 2026</p>
    </footer>
</body>
</html>
