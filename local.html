<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página do País - Brasil</title>
  <meta name="description" content="Informações gerais e clima sobre o Brasil para o projeto WDD131.">
  <meta name="author" content="Gisele Albuquerque">
  <link rel="stylesheet" href="estilos/local.css">
  <script src="scripts/local.js" defer></script>
</head>
<body>
  <header>
    <h1>Brasil</h1>
  </header>

  <main>
    <div class="hero">
      <picture>
        <source media="(min-width: 650px)" srcset="imagens/hero-large.webp">
        <img src="imagens/hero-small.webp" alt="Paisagem representativa do Brasil" width="1000" height="500">
      </picture>
    </div>

    <section class="data-card">
      <h2>Dados Gerais</h2>
      <ul>
        <li><strong>Área:</strong> 8.515.767 km²</li>
        <li><strong>População:</strong> ~214 milhões</li>
        <li><strong>Capital:</strong> Brasília</li>
        <li><strong>Língua Oficial:</strong> Português</li>
        <li><strong>Moeda:</strong> Real (BRL)</li>
      </ul>
    </section>

<section class="weather-card">
  <h2 class="weather-title">Clima</h2>
  
  <!-- Ícone SVG embutido diretamente -->
  <svg class="weather-icon-mobile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
  </svg>

  <ul>
    <li><strong>Temperatura:</strong> <span id="temp">10</span>°C</li>
    <li><strong>Condição:</strong> Chuva</li>
    <li><strong>Vento:</strong> <span id="wind">8</span> km/h</li>
    <li><strong>Sensação Térmica:</strong> <span id="chill"></span></li>
  </ul>
</section>
</main> 

<!-- Rodapé -->
<footer>
  <p>&copy; <span id="currentyear"></span> | Gisele Albuquerque | Brasil</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
